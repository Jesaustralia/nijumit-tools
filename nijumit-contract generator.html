<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NIJUMIT Contract Generator</title>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h2 {
      color: #f7e883;
      margin-bottom: 20px;
    }
    .input-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    input {
      background: #111;
      color: #fff;
      border: 1px solid #f7e883;
      padding: 10px;
      font-size: 14px;
      width: 200px;
      text-align: center;
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    button {
      background-color: #f7e883;
      color: #000;
      font-size: 16px;
      cursor: pointer;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
    }
    #alert {
      color: red;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <h2>✒️ NIJUMIT Contract Generator</h2>

  <div class="input-row">
    <input type="text" id="renter" placeholder="Renter Name">
    <input type="text" id="niche" placeholder="Niche (e.g. Yacht Industry)">
    <input type="text" id="rent" placeholder="Monthly Rent (e.g. 5000 DKK)">
    <input type="text" id="start_date" placeholder="Start Date (e.g. 2025-06-01)">
  </div>

  <div class="button-row">
    <button onclick="generatePDF(1)">1 Month</button>
    <button onclick="generatePDF(3)">3 Months</button>
    <button onclick="generatePDF(6)">6 Months</button>
    <button onclick="generatePDF(12)">12 Months</button>
  </div>

  <p id="alert"></p>

  <script>
    async function generatePDF(months) {
      const renter = document.getElementById('renter').value.trim();
      const niche = document.getElementById('niche').value.trim();
      const rent = document.getElementById('rent').value.trim();
      const startDate = document.getElementById('start_date').value.trim();
      const alert = document.getElementById('alert');

      if (!renter || !niche || !rent || !startDate) {
        alert.textContent = "All fields must be filled.";
        return;
      }

      alert.textContent = "Generating PDF...";

      const templateMap = {
        1: 'TEMPLATE 1.pdf',
        3: 'TEMPLATE 2.pdf',
        6: 'TEMPLATE 3.pdf',
        12: 'TEMPLATE 4.pdf'
      };

      const url = `https://nijumit.com/contracts/templates/${templateMap[months]}`;

      try {
        const existingPdfBytes = await fetch(url, { mode: 'cors' }).then(res => res.arrayBuffer());
        const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
        const form = pdfDoc.getForm();

        form.getTextField('renter').setText(renter);
        form.getTextField('niche').setText(niche);
        form.getTextField('rent').setText(rent);
        form.getTextField('start_date').setText(startDate);

        form.updateFieldAppearances(); // optional, but improves display
        // form.flatten(); // uncomment if you want to lock the fields

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `NIJUMIT_Contract_${months}Months.pdf`;
        link.click();

        alert.textContent = "PDF downloaded successfully!";
        setTimeout(() => { alert.textContent = ""; }, 3000);
      } catch (error) {
        alert.textContent = "Error generating PDF. Check CORS or console.";
        console.error("PDF generation error:", error);
      }
    }
  </script>

</body>
</html>
